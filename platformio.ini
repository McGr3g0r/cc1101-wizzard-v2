; cc1101-wizzard v2 - PlatformIO project for RP2040 (RadioLib backend)
;
; This variant drives the CC1101 through RadioLib instead of the ELECHOUSE
; library. RadioLib's SPI works on current arduino-pico cores, so there is NO
; core/toolchain pinning here - it builds on the latest core.
;
; SPI / GDO pins are in src/settings.h (SPI0: sck=2 miso=4 mosi=3 ss=5,
; gdo0=7 gdo2=6). RadioLib drives CS (ss) itself; see src/platform_rp2040.ino.

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; LittleFS partition (profiles, env, scripts). Pico has 2 MB flash.
board_build.filesystem_size = 0.5m

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    jgromes/RadioLib@7.8.1
